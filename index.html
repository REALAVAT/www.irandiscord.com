<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IRAN DISCORD — irandiscord.com</title>
<meta name="description" content="IRAN DISCORD — the official home of the Iranian Discord community. Live server stats, member counts, and bot status." />
<meta http-equiv="refresh" content="3; url=https://irandiscord.com" />
<link rel="preconnect" href="https://irandiscord.com" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --text: #eef1f7;
    --muted: #9aa3b2;
    --border: #222735;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2033 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 34px;
    line-height: 1.2;
    margin-bottom: 14px;
  }
  p.lead {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  p.lead-fa {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.9;
    direction: rtl;
    margin-bottom: 30px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 34px;
    border-radius: 12px;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  a.button:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
  }
  .url {
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  .url a { color: var(--text); text-decoration: none; }
  .url a:hover { text-decoration: underline; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 30px 0;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">IRAN DISCORD</span>
    <h1>irandiscord.com</h1>
    <p class="lead">The official home of the Iranian Discord community — live server stats, member counts, and bot status.</p>
    <div class="divider"></div>
    <p class="lead-fa">خانهٔ رسمی جامعهٔ دیسکورد ایران — آمار زندهٔ سرور، تعداد اعضا و وضعیت ربات‌ها.</p>
    <a class="button" href="https://irandiscord.com" rel="noopener">Visit the website · ورود به وب‌سایت</a>
    <p class="url">
      Redirecting to <a href="https://irandiscord.com">irandiscord.com</a> · در حال انتقال…
    </p>
  </main>
</body>
</html>
